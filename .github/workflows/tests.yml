name: API tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API and RecSys tests
        run: python -m pytest -q

  recsys-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-recsys.txt
      - name: Install lightweight RecSys dependencies
        run: python -m pip install -r requirements-recsys.txt
      - name: Download verified MovieLens and run real experiment
        run: |
          python -m recsys download
          python -m recsys evaluate --output /tmp/recsys-results
          python -m recsys demo --user-id 9999 --k 5
          python -m recsys audit --output /tmp/recsys-results/shilling.json
      - name: Save experiment results
        uses: actions/upload-artifact@v4
        with:
          name: recsys-results
          path: /tmp/recsys-results/
